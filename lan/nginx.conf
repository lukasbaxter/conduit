server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Conduit static + same-origin proxies so the LAN browser reaches Jellyfin
    # and the relay without CORS. Plain HTTP, fresh origin -> no CF/SW cache.
    location /jf/ {
        proxy_pass http://192.168.1.85:2101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off; proxy_read_timeout 3600s; client_max_body_size 0;
    }
    location /relay {
        proxy_pass http://192.168.1.85:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
