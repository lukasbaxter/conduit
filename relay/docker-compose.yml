services:
  conduit-relay:
    build: .
    container_name: conduit-relay
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      - PORT=8788
      - JELLYFIN_URL=http://192.168.1.85:2101
    networks:
      - docker_internal
networks:
  docker_internal:
    external: true
