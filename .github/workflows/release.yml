# Tag v* -> build the desktop apps and the Android APK, attach them to a
# GitHub Release. macOS and Windows builds are unsigned (no developer
# accounts): macOS users right-click > Open once, Windows users click through
# SmartScreen. The APK is signed with the project's own keystore (secrets).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            glob: 'release/*.dmg'
          - os: windows-latest
            script: dist:win
            glob: 'release/*.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # --publish never: electron-builder otherwise tries to upload to GitHub itself on a tag.
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # ubuntu-latest ships the Android SDK; only the licences need accepting so
      # Gradle can pull the platform/build-tools Expo asks for.
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
      - run: npm ci
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
        env: { CI: '1' }
      - name: Signing config
        working-directory: mobile/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > app/conduit-release.jks
          # Point the release build at our keystore (Expo's template signs
          # release with the debug key). Re-opening the android {} block is
          # additive in the Android Gradle DSL; values come from the environment.
          cat >> app/build.gradle <<'EOG'

          android {
              signingConfigs {
                  release {
                      storeFile file("conduit-release.jks")
                      storePassword System.getenv("CONDUIT_KS_PASS")
                      keyAlias "conduit"
                      keyPassword System.getenv("CONDUIT_KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOG
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
        env:
          CONDUIT_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - run: cp mobile/android/app/build/outputs/apk/release/app-release.apk Conduit-${GITHUB_REF_NAME#v}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Conduit-*.apk
          if-no-files-found: error
  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
